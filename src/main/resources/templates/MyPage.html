<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지</title>

    <link rel="stylesheet" th:href="@{/vercel-theme.css}">
    <link rel="stylesheet" th:href="@{/button-unity.css}">
    <link rel="stylesheet" th:href="@{/myPage.css}">
</head>

<body>

<div th:replace="~{fragments/AppNav :: navigation('profile')}"></div>

<div class="top-menu">
    <button class="back-button" onclick="location.href='/main'">
        ← 메인으로 돌아가기
    </button>
</div>

<div class="page-container">

    <div class="page-title">
        <h1>마이페이지</h1>
    </div>

    <div class="mypage-layout">

        <!-- 왼쪽: 회원정보 -->
        <div class="profile-card">

            <div class="profile-icon">👤</div>

            <div class="info-row">
                <div class="info-title">아이디</div>
                <div class="info-value" th:text="${member.userName}">아이디</div>
            </div>

            <div class="info-row">
                <div class="info-title">비밀번호</div>
                <div class="info-value">등록됨</div>
            </div>

            <div class="info-row">
                <div class="info-title">닉네임</div>
                <div class="info-value" th:text="${member.stdName}">닉네임</div>
            </div>
            <div class="info-row">
                <div class="info-title">학교</div>
                <div class="info-value" th:text="${member.stdSchool}">학교</div>
            </div>
            <div class="info-row">
                <div class="info-title">학번</div>
                <div class="info-value" th:text="${member.stdIDN}">학번</div>
            </div>
            <div class="info-row">
                <div class="info-title">전공</div>
                <div class="info-value"
                     th:text="${member.major == '물리치료학' ? '물리치료학부' : member.major}">
                    전공
                </div>
            </div>
            <div class="info-row">
                <div class="info-title">성별</div>
                <div class="info-value" th:text="${member.stdGender}">성별</div>
            </div>
            <div class="info-row">
                <div class="info-title">생년월일</div>
                <div class="info-value" th:text="${member.stdBirth}">생년월일</div>
            </div>
            <div class="info-row">
                <div class="info-title">관심 콘텐츠</div>
                <div class="info-value"
                     th:if="${member.stdCon != null and !member.stdCon.isEmpty()}"
                     th:text="${#strings.replace(member.stdCon, ',', ', ')}">
                    관심 콘텐츠
                </div>

                <div class="info-value"
                     th:if="${member.stdCon == null or member.stdCon.isEmpty()}">
                    선택한 관심 콘텐츠가 없습니다.
                </div>
            </div>
            <div class="info-row">
                <div class="info-title">가입일</div>
                <div class="info-value" th:text="${member.createDate}">가입일</div>
            </div>
        </div>
        <!-- 오른쪽: 프로필 공개 설정 -->
        <div class="visibility-card">
            <h2 class="visibility-title">프로필 공개 설정</h2>
            <p class="visibility-description">
                다른 회원이 내 프로필을 확인할 때 표시할 정보를 설정할 수 있습니다.
            </p>
            <!-- 학교 -->
            <div class="visibility-row">
                <span class="visibility-label">학교</span>
                <div class="visibility-actions">
                    <button type="button"
                            class="visibility-button"
                            th:classappend="${!member.showSchool} ? ' active' : ''"
                            onclick="changeVisibility('school', false, this)">
                        숨김
                    </button>
                    <button type="button"
                            class="visibility-button"
                            th:classappend="${member.showSchool} ? ' active' : ''"
                            onclick="changeVisibility('school', true, this)">
                        보여주기
                    </button>
                </div>
            </div>
            <!-- 학번 -->
            <div class="visibility-row">
                <span class="visibility-label">학번</span>
                <div class="visibility-actions">
                    <button type="button"
                            class="visibility-button"
                            th:classappend="${!member.showStudentNumber} ? ' active' : ''"
                            onclick="changeVisibility('studentNumber', false, this)">
                        숨김
                    </button>
                    <button type="button"
                            class="visibility-button"
                            th:classappend="${member.showStudentNumber} ? ' active' : ''"
                            onclick="changeVisibility('studentNumber', true, this)">
                        보여주기
                    </button>
                </div>
            </div>
            <!-- 관심 콘텐츠 -->
            <div class="visibility-row">
                <span class="visibility-label">관심 콘텐츠</span>
                <div class="visibility-actions">
                    <button type="button"
                            class="visibility-button"
                            th:classappend="${!member.showInterests} ? ' active' : ''"
                            onclick="changeVisibility('interests', false, this)">
                        숨김
                    </button>
                    <button type="button"
                            class="visibility-button"
                            th:classappend="${member.showInterests} ? ' active' : ''"
                            onclick="changeVisibility('interests', true, this)">
                        보여주기
                    </button>
                </div>
            </div>
            <!-- 전공 -->
            <div class="visibility-row">
                <span class="visibility-label">전공</span>
                <div class="visibility-actions">
                    <button type="button"
                            class="visibility-button"
                            th:classappend="${!member.showMajor} ? ' active' : ''"
                            onclick="changeVisibility('major', false, this)">
                        숨김
                    </button>
                    <button type="button"
                            class="visibility-button"
                            th:classappend="${member.showMajor} ? ' active' : ''"
                            onclick="changeVisibility('major', true, this)">
                        보여주기
                    </button>
                </div>
            </div>
            <!-- 성별 -->
            <div class="visibility-row">
                <span class="visibility-label">성별</span>
                <div class="visibility-actions">
                    <button type="button"
                            class="visibility-button"
                            th:classappend="${!member.showGender} ? ' active' : ''"
                            onclick="changeVisibility('gender', false, this)">
                        숨김
                    </button>
                    <button type="button"
                            class="visibility-button"
                            th:classappend="${member.showGender} ? ' active' : ''"
                            onclick="changeVisibility('gender', true, this)">
                        보여주기
                    </button>
                </div>
            </div>
            <p id="visibility-message" aria-live="polite"></p>
            <!-- 내 활동 기록 -->
            <div class="activity-history-section">

                <h3>내 활동 기록</h3>

                <p>
                    내가 참여했던 모임과 게시글을 확인할 수 있습니다.
                </p>

                <button type="button"
                        class="activity-history-open-button"
                        onclick="openActivityHistory()">
                    활동 기록 보기
                </button>

            </div>
        </div>
    </div>
</div>
<div class="button-area">
    <button onclick="location.href='/mypage/edit'">
        회원정보 수정
    </button>
</div>
<!-- 활동 기록 목록 팝업 -->
<div id="activity-history-modal"
     class="activity-modal"
     hidden>

    <div class="activity-modal-backdrop"
         onclick="closeActivityHistory()">
    </div>

    <div class="activity-modal-content">

        <div class="activity-modal-header">
            <h2>내 활동 기록</h2>

            <button type="button"
                    onclick="closeActivityHistory()">
                ×
            </button>
        </div>

        <div class="activity-modal-actions">
            <button type="button"
                    class="activity-delete-all-button"
                    onclick="deleteAllActivityHistory()">
                전체 삭제
            </button>
        </div>

        <!-- 활동 기록 목록 -->
        <div id="activity-history-list">

            <p>활동 기록을 불러오는 중...</p>

        </div>

    </div>
</div>


<!-- 활동 기록 상세 내용 팝업 -->
<div id="activity-detail-modal"
     class="activity-modal"
     hidden>

    <div class="activity-modal-backdrop"
         onclick="closeActivityDetail()">
    </div>

    <div class="activity-modal-content">

        <div class="activity-modal-header">
            <h2>게시글 상세 내용</h2>

            <button type="button"
                    onclick="closeActivityDetail()">
                ×
            </button>
        </div>

        <div class="activity-detail-content">

            <div class="activity-detail-item">
                <strong>게시글 제목</strong>
                <p id="activity-detail-title"></p>
            </div>

            <div class="activity-detail-item">
                <strong>주요 콘텐츠</strong>
                <p id="activity-detail-main"></p>
            </div>

            <div class="activity-detail-item">
                <strong>세부 콘텐츠</strong>
                <p id="activity-detail-tags"></p>
            </div>

            <div class="activity-detail-item">
                <strong>게시글 내용</strong>
                <p id="activity-detail-content"></p>
            </div>

            <div class="activity-detail-item">
                <strong>가입 시간</strong>
                <p id="activity-detail-date"></p>
            </div>

        </div>

        <div class="activity-detail-footer">
            <button type="button"
                    onclick="closeActivityDetail()">
                닫기
            </button>
        </div>

    </div>
</div>
<script>
    async function changeVisibility(field, visible, button) {
        const params = new URLSearchParams();
        params.append("field", field);
        params.append("visible", visible);
        const message = document.getElementById("visibility-message");
        try {
            const response = await fetch("/mypage/profile-visibility", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: params
            });
            const result = await response.text();
            if (!response.ok) {
                throw new Error(result || "설정 저장에 실패했습니다.");
            }
            // 같은 항목의 버튼만 갱신
            const actions = button.parentElement;
            actions.querySelectorAll(".visibility-button")
                .forEach(item => item.classList.remove("active"));
            button.classList.add("active");
            message.textContent = "공개 설정이 저장되었습니다.";
            message.style.color = "#16803c";
        } catch (error) {
            message.textContent = error.message;
            message.style.color = "#d93025";
        }
    }
    // 활동 기록 날짜 표시
    function formatActivityDate(value) {

        if (!value) {
            return "날짜 정보 없음";
        }

        // LocalDateTime이 배열로 전달되는 경우
        if (Array.isArray(value)) {

            const [year, month, day, hour, minute, second] = value;

            const pad = number =>
                String(number ?? 0).padStart(2, "0");

            return `${year}-${pad(month)}-${pad(day)} ` +
                `${pad(hour)}:${pad(minute)}:${pad(second)}`;
        }

        const date = new Date(value);

        if (isNaN(date.getTime())) {
            return String(value).replace("T", " ");
        }

        return date.toLocaleString("ko-KR");
    }
    // 활동 기록 팝업 열기
    async function openActivityHistory() {

        const modal =
            document.getElementById("activity-history-modal");

        modal.hidden = false;

        await loadActivityHistory();
    }


    // 활동 기록 목록 조회
    async function loadActivityHistory() {

        const container =
            document.getElementById("activity-history-list");

        container.textContent = "활동 기록을 불러오는 중...";

        try {

            const response = await fetch(
                "/member/activity-history"
            );

            if (!response.ok) {
                throw new Error("활동 기록을 불러오지 못했습니다.");
            }

            const histories = await response.json();

            container.innerHTML = "";

            if (histories.length === 0) {

                container.textContent =
                    "아직 활동 기록이 없습니다.";

                return;
            }

            histories.forEach(history => {

                // 한 개의 활동 기록
                const row = document.createElement("div");
                row.className = "activity-history-row";

                // 상세 내용 열기 버튼
                const detailButton =
                    document.createElement("button");

                detailButton.type = "button";
                detailButton.className = "activity-history-item";

                const title = document.createElement("strong");

                title.textContent =
                    history.title || "제목 없음";

                const contents = document.createElement("span");

                contents.textContent =
                    `${history.mainContent || "무"} · ` +
                    `${history.detailContents || "무"}`;

                const date = document.createElement("span");

                date.textContent =
                    "가입 시간: " +
                    formatActivityDate(history.joinedAt);

                detailButton.appendChild(title);
                detailButton.appendChild(contents);
                detailButton.appendChild(date);

                detailButton.addEventListener("click", () => {

                    openActivityDetail(history);

                });

                // 개별 삭제 버튼
                const deleteButton =
                    document.createElement("button");

                deleteButton.type = "button";
                deleteButton.className = "activity-delete-button";
                deleteButton.textContent = "삭제";

                deleteButton.addEventListener("click", event => {

                    event.stopPropagation();

                    deleteActivityHistory(history.historyId);

                });

                row.appendChild(detailButton);
                row.appendChild(deleteButton);

                container.appendChild(row);

            });

        } catch (error) {

            container.textContent = error.message;

            console.error("활동 기록 조회 실패:", error);

        }
    }

    // 활동 기록 팝업 닫기
    function closeActivityHistory() {

        document.getElementById("activity-history-modal").hidden = true;

        closeActivityDetail();
    }
    // 활동 기록 상세 내용 열기
    function openActivityDetail(history) {

        document.getElementById("activity-detail-title")
            .textContent = history.title || "제목 없음";

        document.getElementById("activity-detail-main")
            .textContent = history.mainContent || "무";

        document.getElementById("activity-detail-tags")
            .textContent = history.detailContents || "무";

        document.getElementById("activity-detail-content")
            .textContent = history.postContent || "내용이 없습니다.";

        document.getElementById("activity-detail-date")
            .textContent = formatActivityDate(history.joinedAt);

        document.getElementById("activity-detail-modal").hidden = false;
    }

    // 상세 팝업 닫기
    function closeActivityDetail() {

        document.getElementById("activity-detail-modal").hidden = true;
    }
    // 활동 기록 개별 삭제
    async function deleteActivityHistory(historyId) {

        const confirmed = confirm(
            "이 활동 기록을 삭제하시겠습니까?\n" +
            "삭제하면 다시 복구할 수 없습니다."
        );

        if (!confirmed) {
            return;
        }

        try {

            const response = await fetch(
                `/member/activity-history/${historyId}/delete`,
                {
                    method: "POST"
                }
            );

            const result = await response.text();

            if (!response.ok) {
                throw new Error(result || "삭제에 실패했습니다.");
            }

            alert(result);

            // 목록 갱신
            await loadActivityHistory();

        } catch (error) {

            console.error("활동 기록 삭제 실패:", error);

            alert(error.message);

        }
    }
    // 활동 기록 전체 삭제
    async function deleteAllActivityHistory() {

        const confirmed = confirm(
            "정말 모든 활동 기록을 삭제하시겠습니까?\n" +
            "삭제한 기록은 복구할 수 없습니다."
        );

        if (!confirmed) {
            return;
        }

        try {

            const response = await fetch(
                "/member/activity-history/delete-all",
                {
                    method: "POST"
                }
            );

            const result = await response.text();

            if (!response.ok) {
                throw new Error(result || "전체 삭제에 실패했습니다.");
            }

            alert(result);

            // 상세 팝업도 닫기
            closeActivityDetail();

            // 목록 갱신
            await loadActivityHistory();

        } catch (error) {

            console.error("전체 활동 기록 삭제 실패:", error);

            alert(error.message);

        }
    }
</script>
</body>
</html>
